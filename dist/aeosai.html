lass-border);border-radius:12px;background:rgba(255,255,255,0.06);color:var(--text-primary);font-family:inherit;font-size:0.9rem;font-weight:600;cursor:pointer;transition:background 0.2s,border-color 0.2s}.new-chat-btn:hover{background:rgba(255,255,255,0.12);border-color:var(--accent-color)}.chat-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}.chat-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--text-secondary);font-size:0.86rem;border:1px solid transparent;transition:background 0.15s,color 0.15s}.chat-row:hover{background:rgba(255,255,255,0.07);color:var(--text-primary)}.chat-row.active{background:rgba(255,255,255,0.11);border-color:var(--glass-border);color:var(--text-primary)}.chat-row-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-row-del{display:grid;place-items:center;width:22px;height:22px;flex-shrink:0;border:none;border-radius:6px;background:transparent;color:var(--text-secondary);cursor:pointer;opacity:0;transition:opacity 0.15s,background 0.15s,color 0.15s}.chat-row:hover .chat-row-del{opacity:1}.chat-row-del:hover{background:rgba(255,80,80,0.18);color:#ff8080}.sidebar-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:10px;border-top:1px solid var(--glass-border)}.rail-backdrop{position:fixed;inset:0;z-index:35;display:none;background:rgba(0,0,0,0.45)}.chat-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}.chat-topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--glass-border)}.model-picker{width:260px;max-width:42vw}.model-picker .aeos-dropdown-trigger{padding:8px 14px;border-radius:11px;font-size:0.85rem}.topbar-spacer{flex:1}.status-pill{display:none;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--glass-border);background:var(--glass-bg);font-size:0.74rem;color:var(--text-secondary);white-space:nowrap}.status-pill.show{display:inline-flex}.status-pill.warn{border-color:rgba(255,190,90,0.4);color:#ffc266}.messages{flex:1;min-height:0;overflow-y:auto;padding:26px 22px 10px;scroll-behavior:smooth}.messages-inner{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}.msg{display:flex;gap:12px;align-items:flex-start}.msg.user{flex-direction:row-reverse}.avatar{display:grid;place-items:center;width:30px;height:30px;flex-shrink:0;border-radius:9px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text-secondary)}.msg.assistant .avatar{color:var(--accent-color)}.bubble{max-width:min(680px,78%);padding:12px 16px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass-bg);font-size:0.94rem;line-height:1.6;overflow-wrap:anywhere}.msg.user .bubble{background:color-mix(in srgb,var(--accent-color) 20%,transparent);border-color:color-mix(in srgb,var(--accent-color) 38%,transparent)}.bubble.error{border-color:rgba(255,90,90,0.45);color:#ff9b9b}.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}.bubble ul,.bubble ol{margin:0 0 10px 20px}.bubble code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:0.86em;padding:2px 5px;border-radius:5px;background:rgba(255,255,255,0.11)}.bubble pre{margin:0 0 10px;padding:12px 14px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(0,0,0,0.32);overflow-x:auto}.bubble pre code{padding:0;background:none;font-size:0.84em;line-height:1.5}.bubble a{color:var(--accent-color)}.typing-dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--text-secondary);animation:blink 1.3s infinite ease-in-out}.typing-dots span:nth-child(2){animation-delay:0.18s}.typing-dots span:nth-child(3){animation-delay:0.36s}@keyframes blink{0%,80%,100%{opacity:0.25}40%{opacity:1}}.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;min-height:320px;text-align:center}.empty-state h2{display:inline-block;font-size:5rem;font-weight:700;letter-spacing:-0.04em;line-height:1.18;padding:0.06em 0.12em;margin:-0.06em -0.12em 0;background:var(--header-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 10px rgba(0,0,0,0.3))}.empty-state p{color:var(--text-secondary);font-size:1.5rem;font-weight:400;letter-spacing:0.02em}@media (max-width:860px){.empty-state h2{font-size:3.2rem}.empty-state p{font-size:1.15rem}}.composer-wrap{padding:12px 22px 20px}.composer{width:100%;max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:10px 12px;border:1px solid var(--glass-border);border-radius:18px;background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color 0.2s,box-shadow 0.2s}.composer:focus-within{border-color:var(--accent-color);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-color) 16%,transparent)}#promptInput{flex:1;min-height:24px;max-height:180px;padding:6px 4px;border:none;outline:none;resize:none;background:transparent;color:var(--text-primary);font-family:inherit;font-size:0.95rem;line-height:1.5}#promptInput::placeholder{color:var(--text-secondary)}.send-btn{display:grid;place-items:center;width:38px;height:38px;flex-shrink:0;border:none;border-radius:12px;background:var(--accent-color);color:#0d0d12;cursor:pointer;transition:opacity 0.2s,transform 0.15s}.send-btn:hover{transform:translateY(-1px)}.send-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}.composer-hint{max-width:820px;margin:8px auto 0;font-size:0.72rem;color:var(--text-secondary);text-align:center}.sheet-backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}.sheet-backdrop.open{display:flex}.sheet{width:100%;max-wi

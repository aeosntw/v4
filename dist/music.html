iv></div><div class="shelf-section" id="results-artists-section"><div class="shelf-title"><i data-lucide="user" width="18" height="18"></i> Artists </div><div class="card-grid" id="results-artists"></div></div><div class="shelf-section" id="results-playlists-section"><div class="shelf-title"><i data-lucide="list-music" width="18" height="18"></i> Playlists </div><div class="card-grid" id="results-playlists"></div></div></div></section><section class="view" id="view-recent"><div class="shelf-section"><div class="shelf-title"><i data-lucide="rotate-ccw" width="18" height="18"></i> Recently Played <button class="btn btn-secondary" id="clear-history-btn" style="margin-left:auto;padding:6px 12px;font-size:.78rem;"><i data-lucide="trash-2" width="14" height="14"></i> Clear </button></div><div class="track-list" id="recent-tracks"></div></div></section><section class="view" id="view-detail"><button class="back-btn" id="detail-back"><i data-lucide="chevron-left" width="16" height="16"></i> Back </button><div class="detail-header"><img class="detail-art" id="detail-art" alt=""><div class="detail-meta"><div class="detail-kind" id="detail-kind">Album</div><div class="detail-title" id="detail-title"></div><div class="detail-sub" id="detail-sub"></div><div class="detail-actions"><button class="btn btn-primary" id="detail-play"><i data-lucide="play" width="16" height="16"></i> Play </button><button class="btn btn-secondary" id="detail-shuffle"><i data-lucide="shuffle" width="16" height="16"></i> Shuffle </button><button class="btn btn-secondary" id="detail-radio"><i data-lucide="radio" width="16" height="16"></i> Radio </button><button class="btn btn-secondary" id="detail-queue"><i data-lucide="list-plus" width="16" height="16"></i> Add to queue </button></div></div></div><div id="detail-body"></div></section></div><div class="now-bar" id="now-bar"><div class="now-meta"><img class="now-art" id="now-art" alt="" title="Open lyrics"><div class="now-text"><div class="now-title" id="now-title">Nothing playing</div><div class="now-artist" id="now-artist"></div></div></div><div class="now-center"><div class="transport"><button class="transport-btn" id="shuffle-btn" title="Shuffle"><i data-lucide="shuffle" width="17" height="17"></i></button><button class="transport-btn" id="prev-btn" title="Previous"><i data-lucide="skip-back" width="19" height="19"></i></button><button class="transport-btn play" id="play-btn" title="Play"><i data-lucide="play" width="20" height="20"></i></button><button class="transport-btn" id="next-btn" title="Next"><i data-lucide="skip-forward" width="19" height="19"></i></button><button class="transport-btn" id="repeat-btn" title="Repeat"><i data-lucide="repeat" width="17" height="17"></i></button></div><div class="scrub-wrap"><span class="time-label" id="time-current">0:00</span><div class="scrub" id="scrub"><div class="scrub-track"><div class="load-bar" id="load-bar"></div><div class="scrub-fill" id="scrub-fill"></div></div><div class="scrub-knob" id="scrub-knob"></div></div><span class="time-label" id="time-total">0:00</span></div></div><div class="now-right"><span class="source-badge" id="source-badge" style="display:none"></span><button class="transport-btn" id="radio-btn" title="Endless radio"><i data-lucide="radio" width="17" height="17"></i></button><button class="transport-btn" id="lyrics-btn" title="Lyrics"><i data-lucide="mic-vocal" width="17" height="17"></i></button><button class="transport-btn" id="queue-btn" title="Queue"><i data-lucide="list" width="17" height="17"></i></button><div class="volume-wrap"><button class="transport-btn" id="volume-btn" title="Mute"><i data-lucide="volume-2" width="17" height="17"></i></button><input class="volume-slider" id="volume-slider" type="range" min="0" max="1" step="0.01"></div></div></div><section class="lyrics-stage" id="lyrics-stage" aria-hidden="true"><div class="stage-head"><div class="stage-meta"><img class="stage-art" id="stage-art" alt=""><div class="stage-text"><div class="stage-title" id="stage-title"></div><div class="stage-artist" id="stage-artist"></div></div></div><div class="stage-actions"><button class="icon-btn" id="provider-btn" title="Lyrics source"><i data-lucide="database" width="16" height="16"></i></button><button class="icon-btn" id="sync-mode-btn" title="Lyrics highlighting"><i data-lucide="text-cursor-input" width="16" height="16"></i></button><button class="icon-btn" id="stage-close" title="Close lyrics"><i data-lucide="chevron-down" width="18" height="18"></i></button></div></div><div class="stage-body" id="stage-body"></div></section><aside class="side-panel" id="side-panel"><div class="panel-head"><div class="panel-title">Queue</div><div class="panel-head-actions"><button class="icon-btn" id="panel-close" title="Close"><i data-lucide="x" width="17" height="17"></i></button></div></div><div class="panel-body" id="panel-queue"></div></aside><div class="captcha-backdrop" id="captcha-backdrop" role="dialog" aria-modal="true" aria-labelledby="captcha-title"><div class="captcha-card"><div class="captcha-title" id="captcha-title">Quick check</div><div class="captcha-error" id="captcha-error" style="display:none"></div><div class="captcha-image-row"><img class="captcha-image" id="captcha-image" alt="Captcha question"><button class="icon-btn" id="captcha-refresh" title="New question"><i data-lucide="refresh-cw" width="16" height="16"></i></button></div><input class="captcha-input" id="captcha-input" type="text" inputmode="numeric" autocomplete="off" placeholder="Answer"><div class="captcha-actions"><button class="btn btn-secondary" id="captcha-cancel">Skip</button><button class="btn btn-primary" id="captcha-submit">Continue</button></div></div></div><div class="toast-stack" id="toast-stack"></div><script src="music/api.js"></script><script src="music/lyrics.js"></script><script src="music/player.js"></script><script src="music/ui.js"></script></body></html>

cent-color);box-shadow:0 0 14px var(--accent-color);transform:translateY(-2px)}.more-activities-btn:active{transform:scale(0.96)}.more-activities-btn svg{width:16px;height:16px}.activity-player{position:fixed;top:0;left:0;width:100%;height:100%;background:transparent;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:10000;display:none;flex-direction:column}.activity-player.active{display:flex}.activity-header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.15)}.activity-title{font-size:1.2rem;font-weight:600;color:white}.activity-controls{display:flex;gap:10px;align-items:center}.icon-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);width:40px;height:40px;border-radius:10px;color:rgba(255,255,255,0.75);font-size:1.2rem;cursor:pointer;transition:background 0.2s ease,border-color 0.2s ease,color 0.2s ease,box-shadow 0.2s ease,transform 0.2s cubic-bezier(0.34,1.56,0.64,1);display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(8px)}.icon-btn:hover{background:rgba(255,255,255,0.14);border-color:var(--accent-color);color:var(--accent-color);box-shadow:0 0 12px var(--accent-color);transform:scale(1.1)}.icon-btn:active{transform:scale(0.93)}.icon-btn svg{width:18px;height:18px}.activity-frame{flex:1;width:100%;border:none;background:white}.activity-card{position:relative}.cloud-badge{position:absolute;top:8px;right:8px;z-index:2;padding:2px 8px;border-radius:999px;font-size:0.68rem;font-weight:600;letter-spacing:0.3px;color:var(--text-primary);background:rgba(0,0,0,0.55);border:1px solid var(--accent-color,rgba(255,255,255,0.25));backdrop-filter:blur(6px);pointer-events:none}.activity-card img{width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:10px}</style></head><body><div class="activities-container"><h1

adius:8px;margin-bottom:10px}</style></head><body><div class="activities-container"><h1>Activities</h1><p class="subtitle" id="activitiesSubtitle">Loading activities...</p><div class="search-container"><input type="text" class="search-bar" id="searchBar" placeholder="Search activities..."><button class="reload-btn" id="reloadBtn" onclick="reloadActivities()" title="reload activities"><i data-lucide="refresh-cw"></i></button></div><div class="more-activities" id="moreActivities" style="display: none;"><button class="more-activities-btn" id="moreActivitiesBtn" onclick="openProviderSettings()"><i data-lucide="plus-circle"></i><span id="moreActivitiesLabel">Need more activities?</span></button></div><div id="loadingMessage" class="loading">Loading activities...</div><div id="activitiesGrid" class="activities-grid" style="display: none;"></div><div id="errorMessage" class="error" style="display: none;"></div></div><div class="activity-player" id="activityPlayer"><div class="activity-header"><div class="activity-title" id="activityTitle">Loading...</div><div class="activity-controls"><button class="icon-btn" id="updateBtn" onclick="updateActivity()" title="Update Activity"><i data-lucide="refresh-cw"></i></button><button class="icon-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen"><i data-lucide="maximize"></i></button><button class="icon-btn" onclick="closeActivity()" title="Close">×</button></div></div><iframe class="activity-frame" id="activityFrame"></iframe></div><script>(function(){var k="4a963f1a",p="HAdMWFASWA5aSWYGS1NTAABWDRpsVkkDDFEKBQFPSgJbD0pCEzkBGQFWDQIKXww+BBkMVFJSBlUcSAJQRghSFV0OVxZsVklVB1hcVABOblFMVQpXBFYITWtRQQcFUgYHAkhCRFYSRBNaQWYGS1NXUgFJZgZLUgIAA1EAGwMeU01rUUEHBVIGBwJIAktVE18CQAhWWBM5ARlXUQtTA1UZPgQZDFQAVVQDGD4JTgJfBFUHWRBNQQNFFEYPGWkDHgQHB1QRaQMeAFgBVQoOHkYcUUxTDVUfOQEZAQMKBVYEGFpJB0xYUBJYDlpBZgZLVQlYVQMAHmxWSVMEAg4ABUpuUUxQAAcKVQRITxNcQkYUX0FrUUEDVVUESWtRQQcKVwhSAUwJTgJVAk1rUUEEAwUGVwJIAktEDlgNUUkYF2g7GBpAE0BNUAlfEkBBZgZLUwNYAA

name: Continuous Releases (pkg.pr.new)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish preview to pkg.pr.new
        run: npx pkg-pr-new publish --compact
